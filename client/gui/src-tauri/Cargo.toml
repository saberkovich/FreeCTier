[package]
name = "freec-tier"
version.workspace = true
edition.workspace = true

# Desktop entry point has a requireAdministrator manifest and no unit tests.
# Policy/storage tests live in freec-core; UI behavior uses Playwright.
[[bin]]
name = "freec-tier"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freec-runtime = { path = "../../runtime" }
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
winreg = "0.55"
windows-service = "0.8"
serde.workspace = true
serde_json.workspace = true

# Already in the graph through Tauri; named here so the tray path can suspend
# the WebView2 renderer instead of paying for it while the window is hidden.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
