[package]
name = "freec-service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "freec-service"
path = "src/main.rs"

[dependencies]
freec-core = { path = "../core" }
freec-ipc = { path = "../ipc" }
anyhow.workspace = true
uuid.workspace = true
wintun = "0.5.1"
winreg = "0.55"
windows-service = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
