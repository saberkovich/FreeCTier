[package]
name = "freec-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
freec-core = { path = "../core" }
freec-ipc = { path = "../ipc" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
ed25519-dalek = "2"
directories = "6"
fs2 = "0.4"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Security", "Win32_System_Pipes"] }
