[workspace]
members = ["client/core", "client/ipc", "client/runtime", "client/service", "client/gui/src-tauri"]
default-members = ["client/core", "client/runtime"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
