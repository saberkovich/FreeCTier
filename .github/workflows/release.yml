name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Re-pushing a tag supersedes the previous run instead of racing it.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      FREECTIER_GITHUB_REPOSITORY: ${{ github.repository }}
      FREECTIER_UPDATER_PUBLIC_KEY: ${{ vars.FREECTIER_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate signing configuration
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:FREECTIER_UPDATER_PUBLIC_KEY) { throw 'Configure updater public key variable and private key secret first.' }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Rust has no cache by default: without this every run recompiles the
      # whole dependency tree (Tauri, Steamworks) from scratch. The shared key
      # matches the "Rust cache" workflow that warms it on the default branch;
      # tag runs restore that cache but never save — a cache saved on a tag ref
      # is invisible to every other tag.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: freectier
          add-job-id-key: false
          save-if: 'false'
      - name: Prepare frontend
        run: |
          npm --prefix client/gui ci --no-audit --no-fund
          npm --prefix client/gui run build
      # Cheap checks gate the expensive release build. clippy/test build the
      # debug profile once and share it, and the release build below reuses the
      # cached registry/index from this step.
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
      - name: UI regression tests
        working-directory: client/gui
        run: npm test
      - name: Build portable
        run: .\build.bat --no-pause
      - name: Build signed installer and update manifest
        run: node scripts/release.mjs --signed
      - uses: actions/upload-artifact@v4
        with:
          name: FreeC-Tier-windows-x64
          path: dist/releases/*
      - name: Update tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath dist/releases -File | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Keep existing release title and notes; replace generated assets in place.
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          } else {
            # Fallback for a tag that has no release page yet. Publish immediately.
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "FreeC Tier PREVIEW $tag" --generate-notes
          }
